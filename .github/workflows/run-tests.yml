name: run-tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.5, 8.4, 8.3, 8.2, 8.1]
        laravel: ['9.*', '10.*', '11.*', '12.*', '13.*']
        stability: [prefer-stable]
        include:
          - laravel: 11.*
            testbench: 9.*
          - laravel: 10.*
            testbench: 8.*
          - laravel: 9.*
            testbench: 7.*
          - php: 8.1
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*
        exclude:
          # Laravel 9 to 11 are not tested on PHP 8.5.
          - laravel: 9.*
            php: 8.5
          - laravel: 10.*
            php: 8.5
          - laravel: 11.*
            php: 8.5
          - laravel: 11.*
            php: 8.1
          - laravel: 12.*
            php: 8.1
          # Laravel 13 needs PHP 8.3 or higher.
          - laravel: 13.*
            php: 8.1
          - laravel: 13.*
            php: 8.2

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          # Laravel 9, 10 and 11 no longer get security fixes. They stay supported by this package and are tested on
          # purpose, so Composer may install them despite their advisories. Supported versions keep the default blocking.
          if [[ "${{ matrix.laravel }}" == 9.* || "${{ matrix.laravel }}" == 10.* || "${{ matrix.laravel }}" == 11.* ]]; then
            export COMPOSER_NO_SECURITY_BLOCKING=1
          fi
          # The older Laravel versions are tested on PHP versions they do not officially support, so all platform
          # requirements are ignored. Laravel 13 allows Symfony 8, which needs PHP 8.4. Keep the PHP version check
          # there, so that PHP 8.3 gets Symfony 7.4, and ignore only the extensions.
          platform="--ignore-platform-reqs"
          if [[ "${{ matrix.laravel }}" == 13.* ]]; then
            platform="--ignore-platform-req=ext-*"
          fi
          composer require \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "${{ matrix.php == '8.1' && 'roave/better-reflection:6.25.*' || matrix.php == '8.2' && 'roave/better-reflection:6.66.*' || 'roave/better-reflection:6.*' }}" \
            --no-interaction --no-update "$platform"
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction "$platform"

      - name: Execute tests
        run: vendor/bin/phpunit
